<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="natureAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#a7ffeb" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#00e676" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1b5e20" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#b9f6ca" />
      <stop offset="50%" stop-color="#00e676" />
      <stop offset="75%" stop-color="#00c853" />
      <stop offset="100%" stop-color="#ffd54f" />
    </linearGradient>
    <linearGradient id="natureRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="50%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#69f0ae" />
    </linearGradient>
    <filter id="natureGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="256" cy="256" r="240" fill="url(#natureAura)" />

  <!-- Celestial Druidic Leaf Outer Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#natureRing)" stroke-width="4" stroke-dasharray="14 7" opacity="0.8" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#treeGrad)" stroke-width="7" filter="url(#natureGlow)" />
  <circle cx="256" cy="256" r="198" fill="rgba(8, 30, 18, 0.55)" stroke="url(#natureRing)" stroke-width="2" />

  <!-- Leaf & Spore Spikes on Ring -->
  <g fill="url(#treeGrad)" filter="url(#natureGlow)">
    <polygon points="256,8 266,36 246,36" />
    <polygon points="256,504 266,476 246,476" />
    <polygon points="8,256 36,266 36,246" />
    <polygon points="504,256 476,266 476,246" />
    <polygon points="80,80 104,92 92,104" />
    <polygon points="432,80 420,104 408,92" />
    <polygon points="80,432 92,408 104,420" />
    <polygon points="432,432 408,420 420,408" />
  </g>

