<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="thunderAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#ffd54f" stop-opacity="0.55" />
      <stop offset="65%" stop-color="#e040fb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4a148c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="thunderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff59d" />
      <stop offset="50%" stop-color="#ffd600" />
      <stop offset="75%" stop-color="#e040fb" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>
    <linearGradient id="thunderRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600" />
      <stop offset="50%" stop-color="#e040fb" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>
    <filter id="thunderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="256" cy="256" r="240" fill="url(#thunderAura)" />

  <!-- Celestial Lightning Outer Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#thunderRing)" stroke-width="4" stroke-dasharray="10 6" opacity="0.8" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#thunderGrad)" stroke-width="7" filter="url(#thunderGlow)" />
  <circle cx="256" cy="256" r="198" fill="rgba(25, 10, 42, 0.55)" stroke="url(#thunderRing)" stroke-width="2" />

  <!-- Lightning Arc Spikes on Ring -->
  <g fill="url(#thunderGrad)" filter="url(#thunderGlow)">
    <polygon points="256,6 268,36 244,36" />
    <polygon points="256,506 268,476 244,476" />
    <polygon points="6,256 36,268 36,244" />
    <polygon points="506,256 476,268 476,244" />
    <polygon points="82,82 106,94 94,106" />
    <polygon points="430,82 418,106 406,94" />
    <polygon points="82,430 94,406 106,418" />
    <polygon points="430,430 406,418 418,406" />
  </g>

