<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="fireAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#ff9100" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#ff3d00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#b71c1c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="dragonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff59d" />
      <stop offset="55%" stop-color="#ffb300" />
      <stop offset="85%" stop-color="#ff6d00" />
      <stop offset="100%" stop-color="#dd2c00" />
    </linearGradient>
    <linearGradient id="fireRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3d00" />
      <stop offset="50%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>
    <filter id="dragonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="256" cy="256" r="240" fill="url(#fireAura)" />

  <!-- Celestial Dragon Outer Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#fireRing)" stroke-width="4" stroke-dasharray="14 8" opacity="0.8" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#dragonGold)" stroke-width="7" filter="url(#dragonGlow)" />
  <circle cx="256" cy="256" r="198" fill="rgba(35, 12, 6, 0.55)" stroke="url(#fireRing)" stroke-width="2" />

  <!-- Sun Rays & Flame Spikes -->
  <g fill="url(#dragonGold)" filter="url(#dragonGlow)">
    <polygon points="256,10 266,38 246,38" />
    <polygon points="256,502 266,474 246,474" />
    <polygon points="10,256 38,266 38,246" />
    <polygon points="502,256 474,266 474,246" />
    <polygon points="82,82 106,94 94,106" />
    <polygon points="430,82 418,106 406,94" />
    <polygon points="82,430 94,406 106,418" />
    <polygon points="430,430 406,418 418,406" />
  </g>

