<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="iceAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#80d8ff" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#00b0ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#01579b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="iceCrystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0f7fa" />
      <stop offset="60%" stop-color="#80deea" />
      <stop offset="85%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0288d1" />
    </linearGradient>
    <linearGradient id="iceRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0091ea" />
    </linearGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="256" cy="256" r="240" fill="url(#iceAura)" />

  <!-- Celestial Frost Outer Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#iceRing)" stroke-width="4" stroke-dasharray="16 8" opacity="0.8" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#iceCrystalGrad)" stroke-width="7" filter="url(#iceGlow)" />
  <circle cx="256" cy="256" r="198" fill="rgba(8, 25, 45, 0.55)" stroke="url(#iceRing)" stroke-width="2" />

  <!-- Crystal Spikes Radiating on Ring -->
  <g fill="url(#iceCrystalGrad)" filter="url(#iceGlow)">
    <polygon points="256,8 266,36 246,36" />
    <polygon points="256,504 266,476 246,476" />
    <polygon points="8,256 36,266 36,246" />
    <polygon points="504,256 476,266 476,246" />
    <polygon points="80,80 104,92 92,104" />
    <polygon points="432,80 420,104 408,92" />
    <polygon points="80,432 92,408 104,420" />
    <polygon points="432,432 408,420 420,408" />
  </g>

